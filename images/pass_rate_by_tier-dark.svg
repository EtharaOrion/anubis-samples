<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Partial-credit pass rate by tier. one recorded run per model, tiers cut on opus-5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050c0c"/>
      <stop offset="60%" stop-color="#0a1e1c"/>
      <stop offset="100%" stop-color="#071313"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e2ac52"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(5,12,12,0.55)" stroke-width="3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="110" y="72" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="40" font-weight="bold" fill="#eef2ea">Partial-credit pass rate by tier</text>
  <text x="110" y="108" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="19" fill="#9fc4bc">one recorded run per model, tiers cut on opus-5</text>
  <line x1="1180" y1="47" x2="1226" y2="47" stroke="#35d0ba" stroke-width="4"/>
  <circle cx="1203" cy="47" r="8" fill="#35d0ba" stroke="#0f2723" stroke-width="3"/>
  <text x="1238" y="54" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="20" fill="#eef2ea">opus-5</text>
  <line x1="1338" y1="47" x2="1384" y2="47" stroke="#e2ac52" stroke-width="3.5" stroke-dasharray="9 7"/>
  <polygon points="1361,38 1370,47 1361,56 1352,47" fill="url(#hatch)" stroke="#0f2723" stroke-width="2.5"/>
  <text x="1396" y="54" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="20" fill="#eef2ea">glm-5.3</text>
  <line x1="110" y1="770.0" x2="1540" y2="770.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94" y="777.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">0%</text>
  <line x1="110" y1="615.0" x2="1540" y2="615.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94" y="622.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">15%</text>
  <line x1="110" y1="460.0" x2="1540" y2="460.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94" y="467.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">30%</text>
  <line x1="110" y1="305.0" x2="1540" y2="305.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94" y="312.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">45%</text>
  <line x1="110" y1="150.0" x2="1540" y2="150.0" stroke="rgba(190,225,218,0.12)" stroke-width="1"/>
  <text x="94" y="157.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">60%</text>
  <line x1="110" y1="770.0" x2="1540" y2="770.0" stroke="rgba(190,225,218,0.38)" stroke-width="2"/>
  <line x1="348.3" y1="150" x2="348.3" y2="770" stroke="rgba(190,225,218,0.12)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="825.0" y1="150" x2="825.0" y2="770" stroke="rgba(190,225,218,0.12)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="1301.7" y1="150" x2="1301.7" y2="770" stroke="rgba(190,225,218,0.12)" stroke-width="1" stroke-dasharray="4 8"/>
  <polyline points="348.3,295.6 825.0,382.8 1301.7,300.8" fill="none" stroke="#e2ac52" stroke-width="3.5" stroke-dasharray="9 7"/>
  <polyline points="348.3,244.1 825.0,264.3 1301.7,383.9" fill="none" stroke="#35d0ba" stroke-width="4"/>
  <circle cx="348.3" cy="244.1" r="9" fill="#35d0ba" opacity="0.28" filter="url(#glow)"/>
  <polygon points="348.33333333333337,286.5966666666667 357.33333333333337,295.5966666666667 348.33333333333337,304.5966666666667 339.33333333333337,295.5966666666667" fill="#e2ac52" opacity="0.28" filter="url(#glow)"/>
  <polygon points="348.33333333333337,286.5966666666667 357.33333333333337,295.5966666666667 348.33333333333337,304.5966666666667 339.33333333333337,295.5966666666667" fill="url(#hatch)" stroke="#0f2723" stroke-width="2.5"/>
  <circle cx="348.3" cy="244.1" r="8" fill="#35d0ba" stroke="#0f2723" stroke-width="3"/>
  <text x="348.3" y="222.1" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#35d0ba">50.89%</text>
  <text x="348.3" y="329.6" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#e2ac52">45.91%</text>
  <text x="348.3" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#eef2ea">easy</text>
  <text x="348.3" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">Security</text>
  <circle cx="825.0" cy="264.3" r="9" fill="#35d0ba" opacity="0.28" filter="url(#glow)"/>
  <polygon points="825.0,373.81000000000006 834.0,382.81000000000006 825.0,391.81000000000006 816.0,382.81000000000006" fill="#e2ac52" opacity="0.28" filter="url(#glow)"/>
  <polygon points="825.0,373.81000000000006 834.0,382.81000000000006 825.0,391.81000000000006 816.0,382.81000000000006" fill="url(#hatch)" stroke="#0f2723" stroke-width="2.5"/>
  <circle cx="825.0" cy="264.3" r="8" fill="#35d0ba" stroke="#0f2723" stroke-width="3"/>
  <text x="825.0" y="242.3" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#35d0ba">48.94%</text>
  <text x="825.0" y="416.8" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#e2ac52">37.47%</text>
  <text x="825.0" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#eef2ea">medium</text>
  <text x="825.0" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">Optimization</text>
  <circle cx="1301.7" cy="383.9" r="9" fill="#35d0ba" opacity="0.28" filter="url(#glow)"/>
  <polygon points="1301.6666666666667,291.7633333333334 1310.6666666666667,300.7633333333334 1301.6666666666667,309.7633333333334 1292.6666666666667,300.7633333333334" fill="#e2ac52" opacity="0.28" filter="url(#glow)"/>
  <polygon points="1301.6666666666667,291.7633333333334 1310.6666666666667,300.7633333333334 1301.6666666666667,309.7633333333334 1292.6666666666667,300.7633333333334" fill="url(#hatch)" stroke="#0f2723" stroke-width="2.5"/>
  <circle cx="1301.7" cy="383.9" r="8" fill="#35d0ba" stroke="#0f2723" stroke-width="3"/>
  <text x="1301.7" y="417.9" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#35d0ba">37.36%</text>
  <text x="1301.7" y="278.8" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#e2ac52">45.41%</text>
  <text x="1301.7" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#eef2ea">hard</text>
  <text x="1301.7" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#9fc4bc">Data Processing</text>
  <text x="110" y="876" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="16" fill="#9fc4bc">one task per tier, one run per point, no variance estimate; the opus-5 ordering is the tier definition, not a finding</text>
</svg>
