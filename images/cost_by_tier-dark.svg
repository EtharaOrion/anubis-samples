  <text x="110" y="876" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="16" fill="#9fc4bc">cost tracks the agent time budget, not the tier; the expert task carries a 7200 s timeout against 21600 s</text>
