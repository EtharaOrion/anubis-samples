  <text x="110" y="108" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="19" fill="#9fc4bc">total_cost_usd from agent/trajectory.json, averaged over 8 runs</text>
