<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Mean agent cost per run by tier. total_cost_usd from agent/trajectory.json, averaged over 8 runs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050c0c"/>
      <stop offset="60%" stop-color="#0a1e1c"/>
      <stop offset="100%" stop-color="#071313"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e2ac52"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(5,12,12,0.55)" stroke-width="3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

