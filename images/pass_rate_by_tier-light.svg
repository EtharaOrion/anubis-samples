  <circle cx="1301.7" cy="620.8" r="9" fill="#0e8a78" opacity="0.28" filter="url(#glow)"/>
  <polygon points="1301.6666666666667,619.5366666666666 1310.6666666666667,628.5366666666666 1301.6666666666667,637.5366666666666 1292.6666666666667,628.5366666666666" fill="#b9781f" opacity="0.28" filter="url(#glow)"/>
  <polygon points="1301.6666666666667,619.5366666666666 1310.6666666666667,628.5366666666666 1301.6666666666667,637.5366666666666 1292.6666666666667,628.5366666666666" fill="url(#hatch)" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="1301.7" cy="620.8" r="8" fill="#0e8a78" stroke="#ffffff" stroke-width="3"/>
  <text x="1275.7" y="580.8" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#0e8a78">14.44%</text>
  <text x="1275.7" y="604.8" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#b9781f">13.69%</text>
  <text x="1301.7" y="810" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="26" fill="#0a1414">expert</text>
  <text x="1301.7" y="838" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">n=1</text>
  <text x="110" y="876" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="16" fill="#4a6560">one task per tier; lines are a visual guide across categories, not a continuous trend</text>
