  <polygon points="1301.6666666666667,594.53 1310.6666666666667,603.53 1301.6666666666667,612.53 1292.6666666666667,603.53" fill="url(#hatch)" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="1301.7" cy="533.3" r="8" fill="#0e8a78" stroke="#ffffff" stroke-width="3"/>
