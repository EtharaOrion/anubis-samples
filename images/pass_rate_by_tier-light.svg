  <polygon points="348.33333333333337,260.7633333333334 357.33333333333337,269.7633333333334 348.33333333333337,278.7633333333334 339.33333333333337,269.7633333333334" fill="url(#hatch)" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="348.3" cy="320.7" r="8" fill="#0e8a78" stroke="#ffffff" stroke-width="3"/>
