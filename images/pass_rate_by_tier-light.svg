  <line x1="110" y1="460.0" x2="1540" y2="460.0" stroke="rgba(10,30,28,0.10)" stroke-width="1"/>
  <text x="94" y="467.0" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="18" fill="#4a6560">30%</text>
