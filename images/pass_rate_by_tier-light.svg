<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Partial-credit pass rate by tier. mean combined score over 8 runs per model, tiers cut on opus-5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f4"/>
      <stop offset="60%" stop-color="#f3efe6"/>
      <stop offset="100%" stop-color="#faf8f4"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#b9781f"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="110" y="72" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="40" font-weight="bold" fill="#0a1414">Partial-credit pass rate by tier</text>
  <text x="110" y="108" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="19" fill="#4a6560">mean combined score over 8 runs per model, tiers cut on opus-5</text>
  <line x1="1180" y1="47" x2="1226" y2="47" stroke="#0e8a78" stroke-width="4"/>
  <circle cx="1203" cy="47" r="8" fill="#0e8a78" stroke="#ffffff" stroke-width="3"/>
  <text x="1238" y="54" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="20" fill="#0a1414">opus-5</text>
  <line x1="1338" y1="47" x2="1384" y2="47" stroke="#b9781f" stroke-width="3.5" stroke-dasharray="9 7"/>
