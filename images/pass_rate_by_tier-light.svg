  <text x="348.3" y="247.8" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="21" font-weight="bold" fill="#b9781f">48.41%</text>
