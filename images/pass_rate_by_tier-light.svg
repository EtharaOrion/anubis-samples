  <polygon points="825.0,586.47 834.0,595.47 825.0,604.47 816.0,595.47" fill="#b9781f" opacity="0.28" filter="url(#glow)"/>
  <polygon points="825.0,586.47 834.0,595.47 825.0,604.47 816.0,595.47" fill="url(#hatch)" stroke="#ffffff" stroke-width="2.5"/>
