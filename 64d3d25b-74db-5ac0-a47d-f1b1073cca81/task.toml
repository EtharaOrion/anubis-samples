[task]
name = "terminal-bench/64d3d25b-74db-5ac0-a47d-f1b1073cca81"
description = "Rebuild the corrected installation dossier for a travelling museum exhibition from a fragmented loan, object, gallery, crate, conservation and dependency snapshot and a written specification. Canonicalize identity and units, derive per object geometry, placement, conservation adjustment, shared crate assignment, transport, a dependency graph and its cycle resolution, install order, crew, windows and the final dossier, honouring inclusive and exclusive fit boundaries, a stateful crate contention rule that overturns a locally optimal choice, a deterministic cycle break, a pervasive round half up rule, and twenty four byte exact artifacts ending in a hashed manifest and a folded chain state."
